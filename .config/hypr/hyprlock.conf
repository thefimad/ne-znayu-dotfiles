# hyprlock — black editorial lock screen. No wallpaper, no blur.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb(070707)
}

label {
    monitor =
    text = LOCKED
    color = rgb(8F8D84)
    font_family = JetBrains Mono
    font_size = 9
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(E9E3D5)
    font_family = JetBrains Mono
    font_size = 96
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = rgb(8F8D84)
    font_family = JetBrains Mono
    font_size = 10
    position = 0, 58
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 36
    outline_thickness = 0
    inner_color = rgb(070707)
    outer_color = rgb(070707)
    font_color = rgb(EDE9DF)
    font_family = JetBrains Mono
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    fade_on_empty = false
    placeholder_text =
    position = 0, -64
    halign = center
    valign = center
}

shape {
    monitor =
    size = 320, 1
    color = rgb(3D3D38)
    position = 0, -86
    halign = center
    valign = center
}
