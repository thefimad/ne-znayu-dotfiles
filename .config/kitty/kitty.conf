# Kitty theme matching the panel-block palette.
# Palette source: ~/.config/hypr/modules/colors.lua

font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11

background       #070707
foreground       #EDE9DF
selection_background #E9E3D5
selection_foreground #070707
cursor           #D98A3F
cursor_text_color #070707
url_color        #E9E3D5

active_border_color   #3D3D38
inactive_border_color #2A2A27
bell_border_color     #D98A3F

# Restricted ANSI ramp: palette only (cream / ink / dim / amber).
color0  #070707
color8  #2A2A27
color1  #D98A3F
color9  #D98A3F
color2  #E9E3D5
color10 #E9E3D5
color3  #EDE9DF
color11 #EDE9DF
color4  #8F8D84
color12 #8F8D84
color5  #D98A3F
color13 #D98A3F
color6  #E9E3D5
color14 #E9E3D5
color7  #EDE9DF
color15 #EDE9DF

hide_window_decorations yes
window_padding_width 14
confirm_os_window_close 0
enable_audio_bell no
cursor_shape block
cursor_blink_interval 0
scrollback_lines 10000
